---
- name: Verify guest prerequisites without changing them
  hosts: servers:workers
  gather_facts: false
  tasks:
    - name: Verify the K3s service is active
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ 'k3s' if incus_role == 'server' else 'k3s-agent' }}"]
      changed_when: false
    - name: Verify each dedicated filesystem is mounted
      ansible.builtin.command:
        argv: [findmnt, --mountpoint, "{{ item.value.mount }}", --output, "SOURCE,UUID,FSTYPE"]
      loop: "{{ incus_disks | dict2items | rejectattr('key', 'equalto', 'v2') | list }}"
      changed_when: false
    - name: Verify hugepages remain unallocated when disabled
      ansible.builtin.command:
        argv: [sysctl, -n, vm.nr_hugepages]
      register: verification_hugepages
      changed_when: false
      failed_when: verification_hugepages.stdout | trim != '0'
      when: not v2_hugepages | bool
    - name: Verify V2 kernel modules when enabled
      ansible.builtin.command:
        argv: [test, -d, "/sys/module/{{ item }}"]
      loop: [nvme_tcp, uio_pci_generic, vfio_pci]
      when: incus_enable_v2 | bool
      changed_when: false

- name: Verify Kubernetes readiness
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Reuse readiness checks and describe nodes
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: v1
        kind: Node
        name: "{{ item }}"
      loop: "{{ groups['servers'] + groups['workers'] }}"
      register: verification_node
      failed_when: >-
        verification_node.resources | length != 1 or
        verification_node.resources[0].status.conditions |
        selectattr('type', 'equalto', 'Ready') |
        selectattr('status', 'equalto', 'True') | list | length != 1
    - name: Inspect Longhorn daemonset readiness
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apps/v1
        kind: DaemonSet
        name: longhorn-manager
        namespace: longhorn-system
      register: verification_manager
      failed_when: >-
        verification_manager.resources | length != 1 or
        verification_manager.resources[0].status.numberReady | default(0) < groups['workers'] | length
      when: install_longhorn | bool

    - name: Inspect the configured Longhorn storage network
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: longhorn.io/v1beta2
        kind: Setting
        name: storage-network
        namespace: longhorn-system
      register: verification_storage_network
      failed_when: >-
        verification_storage_network.resources | length != 1 or
        verification_storage_network.resources[0].value != 'longhorn-system/' ~ storage_network_name
      when: install_longhorn | bool and incus_storage_network | bool

    - name: Inspect the Longhorn hugepage setting
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: longhorn.io/v1beta2
        kind: Setting
        name: data-engine-hugepage-enabled
        namespace: longhorn-system
      register: verification_hugepage_setting
      failed_when: >-
        verification_hugepage_setting.resources | length != 1 or
        (verification_hugepage_setting.resources[0].value | from_json).v2 != 'false'
      when: install_longhorn | bool and incus_enable_v2 | bool and not v2_hugepages | bool

    # Longhorn Node CR status only produces warnings: this lab exists to test
    # Longhorn, so a non-green node or disk can be the bug under investigation.
    # Infrastructure, Kubernetes, and configuration checks above still fail.
    - name: Inspect every Longhorn Node CR once its disks are ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: longhorn.io/v1beta2
        kind: Node
        namespace: longhorn-system
      register: verification_longhorn_nodes
      # Give V2 disks time to leave "creating" right after provisioning. If
      # they never do, the problems are reported as warnings below.
      until: >-
        verification_longhorn_nodes.resources | default([]) | map(attribute='status.diskStatus')
        | map('default', {}, true) | map('dict2items') | flatten | map(attribute='value.conditions')
        | map('default', [], true) | flatten | selectattr('type', 'in', ['Ready', 'Schedulable'])
        | selectattr('status', 'equalto', 'True') | list | length
        == groups['workers'] | length * (2 if incus_enable_v2 else 1) * 2
      retries: 30
      delay: 10
      ignore_errors: true
      when: install_longhorn | bool

    - name: Collect missing Longhorn Node CRs
      ansible.builtin.set_fact:
        verification_longhorn_problems: >-
          {{ groups['workers'] | difference(verification_longhorn_nodes.resources | default([])
             | map(attribute='metadata.name') | list) | map('regex_replace', '$', ' has no Longhorn Node CR')
             | list }}
      when: install_longhorn | bool

    - name: Collect Longhorn node and disk conditions that are not True
      ansible.builtin.set_fact:
        verification_longhorn_problems: "{{ verification_longhorn_problems + verification_node_problems }}"
      vars:
        # HugePagesAvailable: when V2 hugepages are disabled, SPDK runs with
        # --no-huge and needs none. Longhorn (v1.13.0 and master-head) still
        # tests node hugepage capacity whenever V2 is enabled, ignoring the
        # data-engine-hugepage-enabled setting, so the condition is a known
        # false negative here. It is reported when v2_hugepages is true.
        verification_ignored_node_conditions: "{{ [] if v2_hugepages | bool else ['HugePagesAvailable'] }}"
        # HealthDataCollected: disk health monitoring (newer Longhorn) reads
        # SMART data. QEMU virtual disks report no SMART support, so smartctl
        # exits 4 and collection always fails in these VMs.
        verification_ignored_disk_conditions: [HealthDataCollected]
        verification_prefix: "{{ item.metadata.name }}: "
        verification_node_failures: >-
          {{ item.status.conditions | default([], true) | rejectattr('status', 'equalto', 'True')
             | rejectattr('type', 'in', verification_ignored_node_conditions) | list }}
        verification_disks: "{{ item.status.diskStatus | default({}, true) | dict2items }}"
        verification_disk_failures: >-
          {{ verification_disks | map(attribute='value.conditions') | map('default', [], true) | flatten
             | rejectattr('status', 'equalto', 'True')
             | rejectattr('type', 'in', verification_ignored_disk_conditions) | list }}
        verification_ready_disk_conditions: >-
          {{ verification_disks | map(attribute='value.conditions') | map('default', [], true) | flatten
             | selectattr('type', 'in', ['Ready', 'Schedulable']) | list | length }}
        verification_expected_disks: "{{ 2 if incus_enable_v2 else 1 }}"
        verification_node_problems: >-
          {{ (verification_node_failures | map(attribute='type')
              | map('regex_replace', '^', verification_prefix ~ 'node condition ') | map('regex_replace', '$', ' is not True')
              | zip(verification_node_failures | map(attribute='message', default='')) | map('join', ' - ') | list)
             + (verification_disk_failures | map(attribute='type')
              | map('regex_replace', '^', verification_prefix ~ 'disk condition ') | map('regex_replace', '$', ' is not True')
              | zip(verification_disk_failures | map(attribute='message', default='')) | map('join', ' - ') | list)
             + ([verification_prefix ~ 'expected ' ~ verification_expected_disks ~ ' disks, found '
                 ~ verification_disks | length] if verification_disks | length != verification_expected_disks | int
                else [])
             + ([verification_prefix ~ 'a disk lacks a Ready or Schedulable condition']
                if verification_ready_disk_conditions | int != verification_expected_disks | int * 2 else []) }}
      loop: "{{ verification_longhorn_nodes.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: install_longhorn | bool

    - name: Warn about Longhorn Node CR status
      ansible.builtin.debug:
        msg: "{{ ['WARNING: Longhorn Node CR status needs attention (not a verify failure):']
                 + verification_longhorn_problems }}"
      when: install_longhorn | bool and verification_longhorn_problems | length > 0

    - name: Report green Longhorn Node CR status
      ansible.builtin.debug:
        msg: Every Longhorn node and disk condition is True, apart from the documented false negatives.
      when: install_longhorn | bool and verification_longhorn_problems | length == 0
