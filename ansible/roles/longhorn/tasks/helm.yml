---
- name: Render Longhorn values for inspection
  ansible.builtin.template:
    src: values.yml.j2
    dest: "{{ project_root }}/shared/longhorn-values.yml"
    mode: "0600"

- name: Install the pinned Longhorn chart
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: longhorn
    release_namespace: longhorn-system
    chart_ref: longhorn
    chart_repo_url: https://charts.longhorn.io
    chart_version: "{{ longhorn_version | regex_replace('^v', '') }}"
    release_values: "{{ lookup('ansible.builtin.template', 'values.yml.j2') | from_yaml }}"
    wait: true
    timeout: 15m
