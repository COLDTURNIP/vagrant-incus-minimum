---
- name: Inspect an existing Longhorn installation
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: apps/v1
    kind: DaemonSet
    name: longhorn-manager
    namespace: longhorn-system
  register: longhorn_existing

- name: Refuse to switch between Helm and manifest installation in place
  ansible.builtin.assert:
    that: >-
      longhorn_existing.resources | length == 0 or
      ('meta.helm.sh/release-name' in longhorn_existing.resources[0].metadata.annotations | default({}, true))
      == longhorn_helm_install | bool
    fail_msg: >-
      Longhorn was installed by the other method. Changing between a released
      version and master-head requires a fresh cluster (destroy and reprovision).

- name: Install a released Longhorn version with Helm
  ansible.builtin.include_tasks: helm.yml
  when: longhorn_helm_install | bool

- name: Install nightly master-head from the master branch manifest
  ansible.builtin.include_tasks: manifest.yml
  when: not longhorn_helm_install | bool

- name: Reconcile the default backup target
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: longhorn.io/v1beta2
      kind: BackupTarget
      metadata:
        name: default
        namespace: longhorn-system
      spec:
        backupTargetURL: "{{ longhorn_backup_url }}"
        credentialSecret: "{{ 'incus-backup-credentials' if backup_target == 'garage' else '' }}"
        pollInterval: 1m

- name: Reconcile runtime settings after installation
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: longhorn.io/v1beta2
      kind: Setting
      metadata:
        name: "{{ item.key }}"
        namespace: longhorn-system
      value: "{{ item.value | string }}"
  loop: "{{ longhorn_settings | dict2items }}"
