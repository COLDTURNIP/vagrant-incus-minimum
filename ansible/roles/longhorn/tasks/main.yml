---
- name: Render Longhorn values for inspection
  ansible.builtin.template:
    src: values.yml.j2
    dest: "{{ project_root }}/shared/longhorn-values.yml"
    mode: "0600"

- name: Install the pinned Longhorn chart
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: longhorn
    release_namespace: longhorn-system
    chart_ref: longhorn
    chart_repo_url: https://charts.longhorn.io
    chart_version: "{{ longhorn_chart_version }}"
    release_values: "{{ lookup('ansible.builtin.template', 'values.yml.j2') | from_yaml }}"
    wait: true
    timeout: 15m

- name: Reconcile the default backup target
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: longhorn.io/v1beta2
      kind: BackupTarget
      metadata:
        name: default
        namespace: longhorn-system
      spec:
        backupTargetURL: "{{ longhorn_backup_url }}"
        credentialSecret: "{{ 'incus-backup-credentials' if backup_target == 'garage' else '' }}"
        pollInterval: 1m

- name: Reconcile runtime settings after chart convergence
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: longhorn.io/v1beta2
      kind: Setting
      metadata:
        name: "{{ item.key }}"
        namespace: longhorn-system
      value: "{{ item.value | string }}"
  loop: "{{ longhorn_settings | dict2items }}"
  vars:
    longhorn_settings:
      create-default-disk-labeled-nodes: "true"
      default-data-path: /var/lib/longhorn
      default-replica-count: "{{ [groups['workers'] | length, 3] | min }}"
      v2-data-engine: "{{ 'true' if incus_enable_v2 else 'false' }}"
      data-engine-hugepage-enabled: "{{ {'v2': 'true' if v2_hugepages else 'false'} | to_json }}"
      data-engine-interrupt-mode-enabled: '{"v2":"false"}'
      storage-network: "{{ 'longhorn-system/' ~ storage_network_name if incus_storage_network else '' }}"
      allow-collecting-longhorn-usage-metrics: "false"
      storage-reserved-percentage-for-default-disk: "0"
