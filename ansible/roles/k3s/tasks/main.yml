---
- name: Select the K3s release artifact
  ansible.builtin.set_fact:
    k3s_artifact: "{{ 'k3s' if ansible_facts.architecture == 'x86_64' else 'k3s-arm64' }}"
    k3s_arch: "{{ 'amd64' if ansible_facts.architecture == 'x86_64' else 'arm64' }}"

- name: Read the pinned release checksums
  ansible.builtin.uri:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}/sha256sum-{{ k3s_arch }}.txt"
    return_content: true
  register: k3s_checksums

- name: Select the exact binary checksum
  ansible.builtin.set_fact:
    k3s_checksum: >-
      {{ k3s_checksums.content | regex_findall('(?m)^([0-9a-f]{64})\\s+\\*?' ~ k3s_artifact ~ '$') }}

- name: Require one matching release checksum
  ansible.builtin.assert:
    that: k3s_checksum | length == 1

- name: Download the pinned K3s binary
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}/{{ k3s_artifact }}"
    dest: /usr/local/bin/k3s
    checksum: "sha256:{{ k3s_checksum | first }}"
    mode: "0755"
  notify: Restart K3s

- name: Create the K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write K3s configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  no_log: true
  notify: Restart K3s

- name: Install the K3s service
  ansible.builtin.template:
    src: k3s.service.j2
    dest: "/etc/systemd/system/{{ 'k3s' if incus_role == 'server' else 'k3s-agent' }}.service"
    mode: "0644"
  notify: Restart K3s

- name: Apply K3s configuration changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start K3s
  ansible.builtin.systemd_service:
    name: "{{ 'k3s' if incus_role == 'server' else 'k3s-agent' }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the server API socket
  ansible.builtin.wait_for:
    host: "{{ incus_node_ips | first }}"
    port: 6443
    timeout: 300
  when: incus_role == 'server'
