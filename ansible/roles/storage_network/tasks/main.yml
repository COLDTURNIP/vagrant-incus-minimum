---
- name: Install persistent storage routing
  ansible.builtin.template:
    src: routes.sh.j2
    dest: /usr/local/sbin/longhorn-storage-network
    mode: "0755"
  notify: Restart storage routing

- name: Install the routing service
  ansible.builtin.template:
    src: storage.service.j2
    dest: /etc/systemd/system/longhorn-storage-network.service
    mode: "0644"
  notify: Restart storage routing

- name: Apply routing changes
  ansible.builtin.meta: flush_handlers

- name: Enable storage routing
  ansible.builtin.systemd_service:
    name: longhorn-storage-network
    state: started
    enabled: true
    daemon_reload: true
