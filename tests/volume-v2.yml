---
apiVersion: v1
kind: Namespace
metadata:
  name: incus-smoke
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: incus-smoke-v2
provisioner: driver.longhorn.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "2"
  dataEngine: v2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: volume-v2
  namespace: incus-smoke
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: incus-smoke-v2
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: volume-v2
  namespace: incus-smoke
spec:
  containers:
    - name: probe
      image: busybox:1.37.0
      command: [sh, -c, "sleep 86400"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: volume-v2
